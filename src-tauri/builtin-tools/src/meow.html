<main><section class="card"><label>四个映射字符<input id="mapping" maxlength="16" value="流萤喵～" spellcheck="false"></label><div class="actions"><button id="reset">恢复默认</button><button id="random">随机字符</button></div><p class="hint">四个字符必须各不相同，解码时顺序也要一致；Emoji 按码点计数。</p><div class="grid"><label>输入内容<textarea id="input" rows="8" maxlength="524288" spellcheck="false" placeholder="输入原文或喵语"></textarea></label><label>转换结果<textarea id="output" rows="8" readonly spellcheck="false"></textarea></label></div><div class="actions"><button id="encode" class="primary">转为喵语</button><button id="decode">按映射还原</button><button id="auto">自动连续还原</button><button id="swap">交换内容</button><button id="copy" disabled>复制结果</button><button id="clear">清空</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><p id="layers" class="hint"></p><p class="hint">这是趣味编码转换。自动还原最多 12 层，映射不明确时会提示手动填写；原文最多 32 KiB，喵语最多 1 MiB，仅在本机处理，不保存输入内容。</p></section></main>
