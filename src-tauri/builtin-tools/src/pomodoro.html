<main><section class="card timer-card"><div id="phases" class="chips"><button data-phase="focus">专注</button><button data-phase="short">短休息</button><button data-phase="long">长休息</button></div><label>当前任务<input id="task" maxlength="100" placeholder="今天想完成什么？"></label><p id="phase-name" class="hint"></p><div class="timer-ring"><span id="time" class="timer-value" role="timer">25:00</span></div><p id="sessions" class="hint"></p><div class="actions"><button id="start" class="primary">开始</button><button id="reset">重置本轮</button><button id="skip">下一阶段</button></div><p id="status" class="status" role="status"></p></section><section class="card"><h2>时钟设置</h2><div class="fields"><label>专注 / 分钟<input id="focus" type="number" min="1" max="180"></label><label>短休息 / 分钟<input id="short" type="number" min="1" max="60"></label><label>长休息 / 分钟<input id="long" type="number" min="1" max="120"></label><label>长休息间隔 / 轮<input id="cycles" type="number" min="2" max="12"></label></div><div class="actions"><label class="check"><input id="sound" type="checkbox">结束时提示音</label><label class="check"><input id="auto" type="checkbox">自动开始下一阶段</label></div><p class="hint">修改时长从下一阶段生效。离开工具或应用进入后台后可能无法及时响铃，回来时会校准剩余时间。</p></section></main>
