<main id="effects-tool" class="image-tool" data-mode="{{mode}}"><section class="card"><div class="actions"><button id="choose" class="primary">选择原图</button></div><p id="source-info" class="hint" style="overflow-wrap:anywhere">原图支持 PNG、JPEG、WebP、TIFF、AVIF、HEIC 等，最多 256 MiB、4000 万像素；动画和多页图片处理首帧。</p><div id="watermark-settings"><div class="grid"><label>水印类型<select id="mark-type"><option value="text">文字水印</option><option value="image">图片水印</option></select></label><label>位置<select id="position"><option value="tile">全覆盖平铺</option><option value="top-left">左上角</option><option value="top-right">右上角</option><option value="bottom-left">左下角</option><option value="bottom-right">右下角</option><option value="center">居中</option></select></label></div><div id="text-settings" class="grid"><label>水印文字<input id="mark-text" maxlength="80" value="流萤百宝箱" placeholder="输入水印文字"></label><label>文字颜色<span class="watermark-color-input"><input id="mark-color" type="color" value="#ffffff" aria-label="选择水印文字颜色"><input id="mark-color-hex" type="text" value="#ffffff" maxlength="7" placeholder="#RRGGBB" autocomplete="off" spellcheck="false" aria-label="水印文字十六进制颜色"></span></label></div><div id="logo-settings" hidden><div class="actions"><button id="choose-mark">选择水印图片</button></div><p id="mark-info" class="hint" style="overflow-wrap:anywhere">支持透明 PNG 等图片，最多 16 MiB、800 万像素。</p></div><div class="grid"><label>透明度（%：100 完全显示）<input id="opacity" type="number" min="0" max="100" step="1" value="30"></label><label>水印宽度（占原图宽度 %）<input id="mark-size" type="number" min="5" max="100" step="1" value="25"></label><label>旋转角度（°）<input id="angle" type="number" min="-180" max="180" step="1" value="-30"></label></div><p class="hint">旋转后自动缩小过大的水印以适应原图。全覆盖会重复平铺；透明度 0 不显示水印。</p></div><div id="pixelate-settings" hidden>{{pixelate-region}}<label>像素块大小（1～512 px）<input id="block" type="number" min="1" max="512" step="1" value="12"></label><p class="hint">块越大，画面细节越少；1 保持原始像素。调整后点击处理查看效果。</p></div><div class="grid"><label>输出格式<select id="format"><option value="png">PNG（保留透明）</option><option value="jpeg">JPEG（白色背景）</option><option value="webp">WebP</option></select></label><label>JPEG / WebP 质量（1～100）<input id="quality" type="number" min="1" max="100" value="90"></label></div><div class="actions"><button id="process" class="primary" disabled>处理并预览</button><button id="save" disabled>保存图片</button><button id="cancel" hidden>取消任务</button></div><p id="status" class="status" role="status"></p><p class="hint">输出最多 512 MiB；重新生成的图片会去除 EXIF 等元数据，预览使用缩略图。</p></section><section id="result" class="card" hidden><h2>处理结果</h2><p id="result-info" class="image-result-info"></p><div class="image-preview"><img id="preview-image" alt="图片处理结果预览"></div></section></main>

<style>.watermark-color-input{display:flex;align-items:center;gap:9px}.watermark-color-input input[type=color]{flex:0 0 44px;width:44px;height:44px;padding:5px}.watermark-color-input input[type=text]{flex:1;height:44px;font-family:Consolas,monospace}.watermark-color-input input[aria-invalid=true]{border-color:var(--error)}</style>
