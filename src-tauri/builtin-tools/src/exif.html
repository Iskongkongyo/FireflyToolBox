<main><section class="card"><div class="actions"><button id="choose" class="primary">选择图片</button><button id="cancel" hidden>取消</button><button id="copy" disabled>复制元数据</button><button id="save" disabled>保存 JSON</button><button id="save-icc" disabled>保存 ICC 配置文件</button></div><p id="status" class="status" role="status"></p><p id="file" class="hint"></p><dl id="summary" class="meta"></dl><div id="results" hidden><div class="grid"><label>元数据类别<select id="category"><option value="">全部类别</option></select></label><label>筛选字段<input id="filter" maxlength="100" placeholder="如：相机、GPS、DateTime、ICC"></label></div><div class="scroll"><table><thead><tr><th>类别</th><th>字段</th><th>值</th></tr></thead><tbody id="tags"></tbody></table></div></div><p class="hint">支持 JPEG、TIFF、PNG、HEIC、AVIF 等格式，文件上限 256 MiB，分块读取；JSON 导出最多 16 MiB。图片可能没有全部类别；解析异常会单独提示。ICC 上限 2 MiB，可保存原始配置文件；超大数表与厂商二进制数据会显示摘要。</p></section></main>
