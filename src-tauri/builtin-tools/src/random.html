<main><section class="card"><label>生成类型<select id="type"><option value="numbers">随机整数</option><option value="strings">随机字符串</option></select></label><div id="number-options"><div class="fields"><label>生成数量<input id="number-count" type="number" min="1" max="1000" value="5"></label><label>最小值（含）<input id="min" type="number" value="1"></label><label>最大值（含）<input id="max" type="number" value="100"></label></div><label class="check"><input id="repeat" type="checkbox" checked>允许重复</label></div><div id="string-options" hidden><div class="grid"><label>生成数量<input id="string-count" type="number" min="1" max="1000" value="5"></label><label>每条字符长度<input id="length" type="number" min="1" max="256" value="16"></label></div><div class="random-options"><label class="check"><input id="digits" type="checkbox" checked>数字字符</label><div class="grid"><label>数字起点（0～9）<input id="digit-min" type="number" min="0" max="9" value="0"></label><label>数字终点（0～9）<input id="digit-max" type="number" min="0" max="9" value="9"></label></div><label class="check"><input id="lower" type="checkbox" checked>小写字母 a–z</label><label class="check"><input id="upper" type="checkbox" checked>大写字母 A–Z</label><label class="check"><input id="symbols" type="checkbox">符号字符</label><label>符号库<input id="symbol-chars" value="!@#$%^&amp;*_-+=?" maxlength="256"></label><label class="check"><input id="custom" type="checkbox">自定义文本字符</label><label>自定义字符库<input id="custom-chars" maxlength="1024" placeholder="如：流萤喵语，或其他字符"></label><label class="check"><input id="exclude" type="checkbox">排除易混淆字符 0 / O / 1 / I / l</label><label class="check"><input id="ensure" type="checkbox">每条至少包含所选的各类字符</label></div><p class="hint">长度按 Unicode 码点计数，字符库会去重；默认按字符库抽取，不强制每类都出现。</p></div><div class="actions"><button id="generate" class="primary">生成</button><button id="copy" disabled>复制结果</button><button id="save" disabled>保存 TXT</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><label>生成结果<textarea id="output" rows="10" readonly spellcheck="false"></textarea></label><p class="hint">每次最多 1000 条，字符串每条最多 256 字符，总计最多 65536 字符。使用系统随机源，生成内容不上传、不保存历史。</p></section></main>
