<main class="qr-generate-tool"><section class="card"><label>内容类型<select id="type"><option value="text">文字</option><option value="url">网址</option><option value="wifi">Wi-Fi</option><option value="contact">联系人（vCard）</option><option value="email">电子邮件</option><option value="phone">电话号码</option><option value="sms">短信</option><option value="geo">地理位置</option></select></label><div id="text-fields" data-qr-fields="text"><label>文字内容<textarea id="text" rows="5" maxlength="8000" placeholder="输入文字，支持中文与 Emoji" spellcheck="false"></textarea></label><button class="mobile-full-row" id="open-text">打开文本文件</button></div><div data-qr-fields="url" hidden><label>网址<input id="url" maxlength="2000" placeholder="https://example.com"></label></div><div data-qr-fields="wifi" hidden><div class="grid"><label>Wi-Fi 名称<input id="ssid" maxlength="128" autocomplete="off"></label><label>加密方式<select id="security"><option value="WPA">WPA / WPA2</option><option value="WEP">WEP</option><option value="nopass">无密码</option></select></label></div><label>Wi-Fi 密码<input id="password" type="password" maxlength="128" autocomplete="off"></label><label class="check"><input id="hidden" type="checkbox">隐藏网络</label></div><div data-qr-fields="contact" hidden><div class="grid"><label>姓名<input id="name" maxlength="100"></label><label>公司 / 组织<input id="company" maxlength="100"></label><label>电话<input id="contact-phone" type="tel" maxlength="50"></label><label>邮箱<input id="contact-email" type="email" maxlength="200"></label><label>网址<input id="contact-url" maxlength="1000"></label><label>备注<textarea id="note" rows="2" maxlength="500"></textarea></label></div></div><div data-qr-fields="email" hidden><label>收件邮箱<input id="email" type="email" maxlength="200"></label><label>主题<input id="subject" maxlength="200"></label><label>正文<textarea id="email-body" rows="4" maxlength="2000"></textarea></label></div><div data-qr-fields="phone,sms" hidden><label>电话号码<input id="phone" type="tel" maxlength="32" placeholder="如：+8613800138000"></label></div><div data-qr-fields="sms" hidden><label>短信内容<textarea id="sms-body" rows="4" maxlength="2000"></textarea></label></div><div data-qr-fields="geo" class="grid" hidden><label>纬度<input id="latitude" type="number" min="-90" max="90" step="any" placeholder="如：39.9075"></label><label>经度<input id="longitude" type="number" min="-180" max="180" step="any" placeholder="如：116.3972"></label></div><details class="qr-options"><summary>样式与高级设置</summary><div class="fields"><label>图片尺寸（px）<input id="size" type="number" value="512" min="128" max="2048" inputmode="numeric"></label><label>前景颜色<div class="qr-color-input"><input id="dark" type="color" value="#000000" aria-label="选择前景颜色"><input id="dark-hex" value="#000000" maxlength="7" spellcheck="false" aria-label="前景颜色 HEX" placeholder="#000000"></div></label><label>背景颜色<div class="qr-color-input"><input id="light" type="color" value="#ffffff" aria-label="选择背景颜色"><input id="light-hex" value="#ffffff" maxlength="7" spellcheck="false" aria-label="背景颜色 HEX" placeholder="#ffffff"></div></label></div><div class="qr-fixed-settings"><span>纠错等级：<strong id="level">H · 最高</strong></span><span>版本：<strong id="version">自动适配</strong></span><span>留白：<strong id="margin">4 单元</strong></span></div><div class="qr-background-presets" aria-label="常用背景颜色"><button type="button" data-qr-light="#ffffff"><i style="background:#ffffff" aria-hidden="true"></i>白色</button><button type="button" data-qr-light="#eaf5ed"><i style="background:#eaf5ed" aria-hidden="true"></i>淡绿</button><button type="button" data-qr-light="#eaf2ff"><i style="background:#eaf2ff" aria-hidden="true"></i>淡蓝</button><button type="button" data-qr-light="#fff0f3"><i style="background:#fff0f3" aria-hidden="true"></i>淡粉</button><button type="button" data-qr-light="#fff7d6"><i style="background:#fff7d6" aria-hidden="true"></i>淡黄</button><button type="button" data-qr-light="#f3edff"><i style="background:#f3edff" aria-hidden="true"></i>淡紫</button></div><label class="check"><input id="transparent" type="checkbox">透明背景（JPEG 使用白色）</label><p id="background-hint" class="hint">使用所选背景颜色。</p><div class="actions"><button id="choose-logo">添加中心图标</button><button id="remove-logo" disabled>移除图标</button></div><p id="logo-info" class="hint">图标最多 2 MiB、400 万像素，固定使用 H 纠错。</p></details><div class="row"><label>保存格式<select id="format"><option value="png">PNG</option><option value="svg">SVG 矢量图</option><option value="webp">WebP</option><option value="jpeg">JPEG</option></select></label></div><div class="actions"><button id="generate" class="primary">生成二维码</button><button id="save" disabled>保存二维码</button><button id="copy" disabled>复制编码内容</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><p class="hint">内容和 Wi-Fi 密码只在本机处理，不保存输入历史。生成后会自动检查二维码是否可识别；带图标或自定义配色的图片，分享前建议再用目标设备扫码确认。</p></section><section id="result" class="card" hidden><h2>二维码预览</h2><div class="image-preview qr-preview"><img id="preview-image" alt="生成的二维码"></div><p id="result-info" class="image-result-info"></p><details><summary>查看实际编码内容</summary><pre id="encoded-content" class="highlight"></pre></details></section></main>
