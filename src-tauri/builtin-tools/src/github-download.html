<main><section class="card"><label>加速服务<select id="provider"><option value="jsdelivr">jsDelivr（cdn.jsdelivr.net）</option><option value="statically">Statically（cdn.statically.io）</option><option value="pd">pd.zwc365.com</option><option value="ghfast">ghfast.top</option></select></label><label>GitHub 链接<input id="url" type="url" maxlength="4096" spellcheck="false" placeholder="https://github.com/用户/仓库/blob/main/文件路径"></label><details id="cdn-settings"><summary>手动指定版本和文件路径（可选）</summary><div class="grid"><label>分支 / 标签 / 提交<input id="ref" maxlength="255" spellcheck="false" placeholder="从链接识别；也可输入完整分支名"></label><label>仓库内文件路径<input id="path" maxlength="2048" spellcheck="false" placeholder="例如：dist/app.js"></label></div><p class="hint">含 / 的分支名请填写完整名称；仓库或目录链接需手动指定要下载的文件。</p></details><p id="provider-hint" class="hint"></p><div class="actions"><button id="generate" class="primary">生成加速链接</button><button id="copy" disabled>复制链接</button><button id="open" disabled>打开加速地址</button><button id="original" disabled>打开原链接</button><button id="clear">清空</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><label>加速地址<textarea id="output" rows="4" readonly spellcheck="false"></textarea></label><p id="details" class="hint" style="overflow-wrap:anywhere"></p><p class="hint">链接在本机转换。下载链接交给系统浏览器，由所选网站处理，线路可用性和速度受网络影响；CDN 用于公开仓库文件。</p></section></main>
