<main class="image-tool"><section class="card"><div class="actions"><button id="choose" class="primary">选择图片</button></div><p id="source-info" class="hint">支持 PNG、JPEG、WebP、BMP、TIFF、AVIF、JXL、GIF、ICO、TGA、HEIC / HEIF 等。单张最多 256 MiB、4000 万像素。</p><div class="grid image-main-settings"><label>输出格式<select id="format"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="webp">WebP</option><option value="bmp">BMP</option><option value="tiff">TIFF</option><option value="avif">AVIF</option><option value="jxl">JPEG XL</option><option value="gif">GIF（静态）</option><option value="ico">ICO（最长边 256）</option></select></label><label>图片质量（1～100）<input id="quality" type="number" inputmode="numeric" min="1" max="100" value="100"></label><label class="image-edge-setting">最长边（像素，0 保持原尺寸）<input id="edge" type="number" min="0" max="16384" step="1" value="0"></label></div><div class="grid"><label>背景处理<select id="background"><option value="transparent">保留透明（JPEG 使用白色）</option><option value="color">填充颜色</option></select></label><label>填充颜色<div class="qr-color-input"><input id="color" type="color" value="#ffffff" aria-label="选择填充颜色"><input id="color-hex" value="#ffffff" maxlength="7" spellcheck="false" aria-label="填充颜色 HEX"></div></label></div><div class="actions"><button id="process" class="primary" disabled>转换格式</button><button id="save" disabled>保存图片</button><button id="cancel" hidden>取消任务</button></div><p id="status" class="status" role="status"></p><p class="hint">质量用于 JPEG、WebP、AVIF、JPEG XL。动画及多页文件转换首帧；GIF 为静态输出，HEIC / HEIF 仅支持输入。转换会去除 EXIF 等元数据。输出最多 512 MiB，预览使用缩略图。</p></section><section id="result" class="card" hidden><h2>转换结果</h2><p id="result-info" class="image-result-info"></p><div class="image-preview"><img id="preview-image" alt="转换结果预览"></div></section></main>
