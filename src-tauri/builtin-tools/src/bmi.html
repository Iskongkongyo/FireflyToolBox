<main class="practical-tool"><section class="card"><div class="grid"><label>身高（cm）<input id="height" type="number" inputmode="decimal" min="50" max="250" step="0.1" placeholder="如：170"></label><label>体重<div class="row"><input id="weight" type="number" inputmode="decimal" min="0.1" step="0.1" placeholder="如：60"><select id="unit" aria-label="体重单位"><option value="kg">千克（kg）</option><option value="jin">斤</option></select></div></label></div><div class="actions"><button id="calculate" class="primary">计算 BMI</button><button id="clear">清空</button><button id="copy" disabled>复制结果</button></div><p id="status" class="status" role="status"></p><div id="results" class="bmi-result" hidden><div><span class="hint">你的 BMI</span><strong id="bmi-value"></strong><span id="category" class="badge"></span></div><p id="range"></p><p class="hint">BMI = 体重（kg）÷ 身高（m）²；分类按未舍入的结果判定。</p></div></section><section class="card"><h2>中国成人参考标准</h2><div class="bmi-reference"><div><strong>体重偏低</strong><span>小于 18.5</span></div><div><strong>正常范围</strong><span>18.5 至小于 24</span></div><div><strong>超重</strong><span>24 至小于 28</span></div><div><strong>肥胖</strong><span>28 及以上</span></div></div><p class="hint">参考国家卫生健康委成人标准。适用于 18 岁及以上成年人，不适用于儿童或孕期；BMI 无法区分肌肉与脂肪，结果仅供参考。</p></section></main>
