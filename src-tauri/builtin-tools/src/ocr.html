<main class="image-tool ocr-tool">
<div class="ocr-layout"><section class="card ocr-source">
<div class="ocr-heading"><div><h2>选择识别区域</h2><p class="hint">默认全图，可拖拽或触摸框选</p></div><div class="actions"><button id="choose" class="primary">选择图片</button><button id="reset" disabled>全图</button></div></div>
<p id="source-info" class="hint">常见图片格式，最大 32 MiB、4000 万像素；动画识别首帧。</p>
<div id="empty" class="ocr-empty"><span aria-hidden="true">文</span><strong>选择一张图片开始</strong><p>截图、照片或扫描件均可，选区使用原图像素。</p></div>
<div id="editor" hidden><div class="ocr-canvas-wrap"><canvas id="canvas" aria-label="拖拽或触摸选择识别区域"></canvas></div><p class="ocr-selection-info hint" id="selection-info"></p><details class="ocr-details"><summary>精确设置选区</summary><div class="grid ocr-coordinates"><label>左侧 X<input id="left" type="number" min="0" value="0"></label><label>顶部 Y<input id="top" type="number" min="0" value="0"></label><label>宽度<input id="width" type="number" min="1" value="1"></label><label>高度<input id="height" type="number" min="1" value="1"></label></div></details></div>
<div class="grid ocr-settings"><label>识别模式<select id="mode"><option value="standard">标准（推荐）</option><option value="small">小字优化（较慢）</option><option value="line">单行选区</option></select></label><label>图片方向<select id="rotation"><option value="0">保持原方向</option><option value="90">顺时针 90°</option><option value="180">旋转 180°</option><option value="270">逆时针 90°</option></select></label></div>
<details class="ocr-details"><summary>图像与排版设置</summary><label>图像增强<select id="enhance"><option value="none">原图（推荐）</option><option value="auto">增强对比度</option><option value="binary">黑白文字</option></select></label><div class="ocr-checks"><label class="check"><input id="invert" type="checkbox">深色背景反色</label><label class="check"><input id="deskew" type="checkbox">矫正轻微倾斜</label><label class="check"><input id="sort" type="checkbox" checked>按阅读顺序排列</label><label class="check"><input id="merge-spaces" type="checkbox" checked>合并中文字符间空格</label></div></details>
<div class="actions ocr-run-actions"><button id="process" class="primary" disabled>识别选区</button><button id="cancel" hidden>取消识别</button></div><progress id="progress" value="0" max="1" hidden></progress><p id="status" class="status" role="status">先选择图片，然后框选需要识别的文字。</p>
</section>
<section class="card ocr-result"><div class="ocr-heading"><div><h2>识别结果</h2><p id="confidence" class="hint">结果可直接编辑和校对</p></div></div><textarea id="output" rows="14" maxlength="1048576" aria-label="识别结果，可编辑" placeholder="识别结果会显示在这里…"></textarea><div class="actions"><button id="copy" disabled>复制文字</button><button id="save" disabled>保存 TXT</button></div>
<details id="recognition-preview" class="ocr-details" hidden><summary>查看检测到的文字行</summary><div class="ocr-canvas-wrap ocr-result-preview"><canvas id="result-canvas" aria-label="识别选区中的文字行"></canvas></div><p class="hint">点击文字行可高亮对应区域；分数供校对参考。</p><div id="lines" class="ocr-lines"></div></details>
<p class="hint">选区尽量贴近文字。单行模式适合一行标题或短句；多栏页面可按栏分次框选。</p></section></div></main>
