<main class="image-tool"><section class="card"><div class="actions"><button id="add" class="primary">添加图片</button><button id="clear" disabled>清空图片</button></div><p id="empty" class="hint">添加至少两张图片后开始拼接，每次选择一张，可继续添加。</p><ol id="images" class="stitch-images"></ol><div class="grid stitch-main-settings"><label>拼接方式<select id="direction"><option value="vertical">纵向长图</option><option value="horizontal">横向拼接</option><option value="grid">网格拼图</option></select></label><label>统一尺寸（px）<input id="tile-size" type="number" inputmode="numeric" min="64" max="4096" value="800"></label></div><p id="tile-hint" class="hint">每张图片的宽度，等比缩放</p><div class="fields"><label>图片间距 / 外边距（px）<input id="gap" type="number" inputmode="numeric" min="0" max="100" value="12"></label><label id="columns-label" hidden>网格列数<select id="columns"><option value="1">1 列</option><option value="2" selected>2 列</option><option value="3">3 列</option><option value="4">4 列</option><option value="5">5 列</option><option value="6">6 列</option></select></label><label id="grid-fit-label" hidden>网格图片适配<select id="grid-fit"><option value="cover">等比铺满（必要时裁切）</option><option value="contain">完整显示（可能留边）</option></select></label><label>输出格式<select id="format"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="webp">WebP</option></select></label><label>图片质量（1～100）<input id="quality" type="number" inputmode="numeric" min="1" max="100" value="90"></label></div><div class="grid"><label>背景处理<select id="background"><option value="color">填充颜色</option><option value="transparent">透明背景（JPEG 使用白色）</option></select></label><label>填充颜色<span class="qr-color-input"><input id="color" type="color" value="#ffffff" aria-label="选择填充颜色"><input id="color-hex" value="#ffffff" maxlength="7" placeholder="#ffffff" aria-label="填充颜色十六进制值" spellcheck="false"></span></label></div><div class="actions"><button id="process" class="primary" disabled>生成拼接图</button><button id="save" disabled>保存图片</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><p class="hint">最多 12 张 PNG/JPEG/WebP/BMP 静态图片，单张 64 MiB / 2400 万像素，累计 256 MiB / 4800 万像素。输出最多 128 MiB、2400 万像素、单边 16384 px；超限时可减小统一尺寸。网格单元按首图宽高比排列。不同宽高比可选铺满裁切或完整显示留边；不足一行及原图透明部分会显示背景。</p></section><section id="result" class="card" hidden><h2>拼接结果</h2><p id="result-info" class="image-result-info"></p><div class="image-preview"><img id="preview-image" alt="拼接结果预览"></div></section></main>
