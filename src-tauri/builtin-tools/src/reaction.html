<main class="reaction-tool"><div class="reaction-area"><button id="pad" class="reaction-pad" type="button"><strong id="prompt">按住开始</strong><span id="detail">手指保持在卡片上，等待绿色提示</span></button></div><section class="card"><div class="reaction-records"><div><span>最快记录</span><strong id="best">—</strong></div><div><span>近五次平均</span><strong id="average">—</strong></div><div><span>本次成绩</span><strong id="last">—</strong></div></div><p id="history" class="hint"></p><div class="actions"><button id="reset">清空记录</button></div><div id="confirm" class="inline-confirm" hidden><span>清空最快成绩和近期记录？</span><button id="confirm-reset">清空</button><button id="cancel-reset">取消</button></div><p id="status" class="status" role="status"></p><p class="hint">每轮随机等待约 1.5～5 秒。提前松手、移出卡片、窗口失去焦点或切到后台均不计入成绩；电脑也可按住空格 / Enter，看到提示后松开。成绩包含设备显示与输入延迟，仅用于趣味测试。</p></section></main>
