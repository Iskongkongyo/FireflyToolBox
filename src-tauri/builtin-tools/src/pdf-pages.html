<main><section class="card"><div class="actions"><button id="choose" class="primary">选择 PDF</button><button id="all">全选</button><button id="none">取消全选</button><button id="sort">按原页码排序</button></div><p id="source-info" class="hint" style="overflow-wrap:anywhere">最多 64 MiB、200 页；需要打开密码的文件请填写密码后读取。</p><div class="grid"><label>PDF 打开密码（可选）<input id="password" type="password" autocomplete="off" maxlength="1024" placeholder="无需密码可留空"></label><div class="actions"><button id="unlock" disabled>读取 / 重新读取页面</button></div></div><label class="check"><input id="split" type="checkbox">每个选中页保存为独立 PDF，打包 ZIP</label><div class="actions"><button id="process" class="primary" disabled>导出选中页面</button><button id="save" disabled>保存结果</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><p class="hint">未勾选的页面不导出；输出最多 64 MiB。保留页面文字和矢量内容；输出 PDF 不加密，不保留原文档书签、交互表单或附件。</p></section><section id="pages" class="fields"></section><section id="result" class="card" hidden><h2>导出结果</h2><p id="result-info"></p><div class="image-preview"><img id="preview-image" alt="导出首页预览"></div></section></main>
