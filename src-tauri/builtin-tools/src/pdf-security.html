<main id="pdf-security" class="pdf-security image-tool" data-mode="{{mode}}"><section class="card"><button id="choose" class="mobile-full-row primary">选择 PDF</button><p id="source-info" class="hint">单个 PDF 最多 64 MiB。</p><label id="source-password-field">原文件密码（如有）<input id="source-password" type="password" autocomplete="off" maxlength="1024" placeholder="未加密或打开密码为空时留空"></label><div id="encrypt-fields"><div class="grid"><label>新打开密码<input id="opening" type="password" autocomplete="new-password" maxlength="127"></label><label>确认打开密码<input id="confirm" type="password" autocomplete="new-password" maxlength="127"></label><label>权限密码（可选）<input id="owner" type="password" autocomplete="new-password" maxlength="127" placeholder="留空时与打开密码相同"></label></div><details><summary>阅读权限设置</summary><div class="actions"><label class="check"><input id="allow-print" type="checkbox" checked>允许打印</label><label class="check"><input id="allow-copy" type="checkbox" checked>允许复制文字和图片</label><label class="check"><input id="allow-modify" type="checkbox" checked>允许修改</label></div><p class="hint">设置限制时需填写不同的权限密码。权限限制是否生效取决于 PDF 阅读器。</p></details><p class="hint">使用 AES-256。新密码最多 127 个 UTF-8 字节，中文通常每字占 3 字节；文件与密码不上传、不保存到工具设置。</p></div><div class="actions"><button id="process" class="primary" disabled>开始处理</button><button id="save" disabled>保存结果</button><button id="clear">清空</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><p id="usage" class="hint"></p></section><section id="result" class="card" hidden><h2>处理结果</h2><p id="result-info"></p></section></main>
