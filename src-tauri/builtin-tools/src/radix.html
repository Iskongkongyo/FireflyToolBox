<main class="radix-tool"><section class="card"><div class="radix-direction"><label>来源进制<select id="from"></select></label><button id="swap" title="交换进制与转换结果" aria-label="交换进制">⇄</button><label>目标进制<select id="to"></select></label></div><div class="grid radix-editors"><label>待转换的整数<textarea id="input" rows="6" placeholder="如：255，或 FF（来源选 16 进制）" spellcheck="false"></textarea></label><label>目标结果<textarea id="output" rows="6" readonly placeholder="转换结果将显示在这里"></textarea></label></div><div class="actions"><button id="run" class="primary">转换</button><button id="copy">复制目标结果</button></div><p id="status" class="status" role="status"></p><p class="hint">支持负数和大整数，最多 4096 位。支持对应进制的 0b、0o、0x 前缀，暂不支持小数。</p></section></main>
