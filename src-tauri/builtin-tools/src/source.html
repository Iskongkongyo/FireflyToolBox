<main><section class="card"><label>HTTPS 地址<input id="url" placeholder="如：https://www.baidu.com" type="text" spellcheck="false" /></label><label>文本编码<select id="encoding"><option value="auto">自动（响应声明 / BOM / UTF-8）</option><option value="utf-8">UTF-8</option><option value="gbk">GBK</option><option value="gb18030">GB18030</option><option value="big5">Big5</option><option value="utf-16le">UTF-16 LE</option><option value="windows-1252">Windows-1252</option></select></label><div class="actions"><button id="fetch" class="primary">获取源码</button><button id="cancel" hidden>取消请求</button></div><p id="status" class="status" role="status"></p><p class="hint">请求最长 15 秒、响应最高 4 MiB。页面通过 JavaScript 生成的动态内容，需要在浏览器开发者工具中查看。</p></section><section id="results" class="card" hidden><h2>响应信息</h2><dl id="info" class="meta"></dl><label>原始源码<textarea id="output" rows="18" readonly spellcheck="false"></textarea></label><div class="actions"><button id="copy">复制源码</button><button id="save">保存原始文件</button></div></section></main>
