<main id="edit-tool" class="image-tool" data-mode="{{mode}}"><section class="card"><button id="choose" class="primary">选择媒体文件</button><p id="source-info" class="hint" style="overflow-wrap:anywhere">最多 2 GiB，离线处理，保留原文件。</p><div class="grid"><label>起点（秒或 HH:MM:SS）<input id="start" value="0"></label><label>终点（秒或 HH:MM:SS）<input id="end" value="5"></label><label>输出格式<select id="format"></select></label><label>输出质量<select id="quality"><option value="high">高质量</option><option value="balanced" selected>均衡</option><option value="small">较小体积</option></select></label></div><div id="video-settings"><div class="grid"><label>裁剪左侧 X<input id="x" type="number" min="0" value="0"></label><label>裁剪顶部 Y<input id="y" type="number" min="0" value="0"></label><label>裁剪宽度<input id="width" type="number" min="0" value="0"></label><label>裁剪高度<input id="height" type="number" min="0" value="0"></label><label>旋转<select id="rotation"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label><label class="check"><input id="mirror" type="checkbox">水平镜像</label><label class="check"><input id="mute" type="checkbox">静音</label></div><p class="hint">裁剪坐标基于解码后的画面；宽高同时为 0 表示整图。输出使用偶数尺寸，旋转后宽高可能交换。</p></div><div id="audio-settings" class="grid" hidden><label>淡入（秒）<input id="fade-in" type="number" min="0" step="0.1" value="0"></label><label>淡出（秒）<input id="fade-out" type="number" min="0" step="0.1" value="0"></label></div><div class="actions"><button id="process" class="primary" disabled>开始剪辑</button><button id="save" disabled>保存结果</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><p class="hint">按所选区间重新编码，实际时长可能存在帧或音频采样误差；质量不保证体积一定减小。预览播放支持取决于 WebView。</p></section><section id="result" class="card" hidden><h2>剪辑结果</h2><p id="result-info"></p><video id="video-preview" controls style="max-width:100%;max-height:360px"></video><audio id="audio-preview" controls hidden style="width:100%"></audio></section></main>
