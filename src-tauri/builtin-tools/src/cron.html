<main><section class="card"><h2>常用模板</h2><div id="templates" class="chips"></div></section><section class="card"><h2>生成表达式</h2><label class="check"><input id="seconds" type="checkbox" />包含秒字段</label><div id="fields" class="fields" style="margin-top:14px"></div><button id="generate">生成到下方</button></section><section class="card"><label>表达式<input id="expression" spellcheck="false" placeholder="如：*/5 * * * *" /></label><div class="fields"><label>时区<input id="timezone" list="zones" /><datalist id="zones"><option>Asia/Shanghai</option><option>UTC</option><option>Asia/Tokyo</option><option>Europe/London</option><option>America/New_York</option></datalist></label><label>起始时间（所选时区）<input id="start" type="datetime-local" /></label><label>后续次数<select id="count"><option>5</option><option selected>10</option><option>20</option></select></label></div><div class="actions"><button id="parse" class="primary">解析与预览</button><button id="copy">复制表达式</button></div><p id="status" class="status" role="status"></p><p class="hint">5/6 字段均采用 Unix 星期编号（0/7 为周日），不按 Quartz 星期编号解析。日和星期同时限定时按 OR 处理。支持列表、范围、步长、L、#；暂不支持 Quartz 年份、W 或 H 随机字段。</p></section><section id="results" class="card" hidden><h2>字段解析</h2><div class="scroll"><table><thead><tr><th>字段</th><th>内容</th><th>含义</th></tr></thead><tbody id="description"></tbody></table></div><h2 style="margin-top:20px">后续执行时间</h2><ol id="dates"></ol></section></main>
