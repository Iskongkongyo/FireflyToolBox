<main class="calendar-tool"><section class="card"><div class="calendar-toolbar"><button id="previous" aria-label="上个月">‹</button><label>选择日期<input id="date" type="date" min="1900-01-01" max="2100-12-31"></label><button id="next" aria-label="下个月">›</button><button id="today">今天</button></div><div class="calendar-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="month" class="calendar-grid" role="group" aria-label="月历"></div><p id="status" class="status" role="status"></p></section><section class="card"><div class="weather-heading"><h2 id="selected-date">日期详情</h2><button id="copy" disabled>复制日期信息</button></div><dl id="details" class="meta"></dl><details><summary>传统黄历宜忌</summary><p id="yi"></p><p id="ji"></p><p class="hint">宜忌是传统民俗资料，仅作文化参考。</p></details></section><section class="card"><h2>农历转公历</h2><div class="fields"><label>农历年<input id="lunar-year" type="number" min="1899" max="2100" inputmode="numeric"></label><label>农历月（含闰月）<select id="lunar-month"></select></label><label>农历日<select id="lunar-day"></select></label></div><button id="convert" class="mobile-full-row primary">转为公历并查看</button><p id="convert-status" class="status" role="status"></p></section><p class="hint">支持 1900～2100 年，离线计算。节气时间按北京时间显示。休 / 班标记使用已收录的放假调休数据，当前截至 2026 年；未收录年份不预测调休安排。</p></main>
