<main><section class="card"><label>决定内容<input id="subject" maxlength="100" placeholder="如：今天吃什么？"></label><h2 id="wheel-subject" class="wheel-subject" hidden></h2><div class="wheel-wrap"><div class="wheel-pointer" aria-hidden="true"></div><canvas id="wheel" width="600" height="600" aria-label="决定转盘"></canvas></div><p id="winner" class="big-result" role="status">准备好了就转一下</p><div class="actions"><button id="spin" class="primary">开始转盘</button><button id="copy">复制决定</button></div><p id="status" class="status" role="status"></p></section><section class="card"><h2>编辑转盘选项</h2><div id="options" class="option-list"></div><div class="actions"><button id="add">添加选项</button></div><p class="hint">支持 2–24 个选项，设置会自动保存。</p></section></main>

<style>.wheel-subject{text-align:center;font-size:20px;line-height:1.5;margin:22px auto 0;max-width:520px;white-space:pre-wrap;overflow-wrap:anywhere}</style>
