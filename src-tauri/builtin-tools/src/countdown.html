<main><section class="card"><h2 id="form-title">添加日子</h2><div class="grid"><label>名称<input id="name" maxlength="60" placeholder="如：生日、旅行、考试"></label><label>目标日期<input id="date" type="date" min="1000-01-01" max="9998-12-31"></label></div><label>备注<input id="note" maxlength="120" placeholder="可选"></label><div class="actions"><label class="check"><input id="yearly" type="checkbox">每年重复</label><label class="check"><input id="include" type="checkbox">计入今天</label></div><div class="actions"><button id="save" class="primary">添加日子</button><button id="cancel-edit" hidden>取消编辑</button><button id="copy">复制全部日子</button></div><p id="status" class="status" role="status"></p><p class="hint">最多保存 50 个日子。重复的 2 月 29 日在平年按 2 月 28 日计算。</p></section><div id="days" class="countdown-list"></div><div id="delete-confirm" class="inline-confirm" hidden><span>删除这个日子？</span><button id="confirm-delete">删除</button><button id="cancel-delete">取消</button></div></main>
