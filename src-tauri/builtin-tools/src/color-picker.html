<main><section class="card"><div class="actions"><button id="open" class="primary">导入图片</button><button id="cancel" hidden>取消</button></div><p id="image-info" class="hint">PNG / JPEG / WebP / BMP，最大 64 MiB、2400 万像素，最长边 16000 px。</p><p id="status" class="status" role="status"></p><div id="picker-stage" class="picker-stage" hidden><canvas id="image-canvas" tabindex="0" aria-label="图片取色区域，方向键移动一个像素"></canvas><div id="picker-crosshair" class="picker-crosshair" hidden></div><div id="loupe" class="picker-loupe" hidden><canvas id="loupe-canvas" width="126" height="126" aria-label="像素放大镜"></canvas><span id="loupe-hex"></span></div></div></section><section id="result" class="card" hidden><div class="picker-result-heading"><div class="picker-preview-backdrop"><div id="color-preview" class="picker-color-preview"></div></div><div><h2 id="pixel-position"></h2><p id="alpha" class="hint"></p></div></div><div class="picker-values"><div><span>HEX</span><code id="hex"></code><button id="copy-hex">复制</button></div><div><span>RGB</span><code id="rgb"></code><button id="copy-rgb">复制</button></div><div><span>HSL</span><code id="hsl"></code><button id="copy-hsl">复制</button></div><div id="hex8-row" hidden><span>HEX8</span><code id="hex8"></code><button id="copy-hex8">复制</button></div></div><div class="actions picker-step"><button id="left" aria-label="左移一个像素">←</button><button id="up" aria-label="上移一个像素">↑</button><button id="down" aria-label="下移一个像素">↓</button><button id="right" aria-label="右移一个像素">→</button><button id="copy-all">复制全部</button></div><h2>取色记录</h2><div id="history" class="picker-history"></div><p class="hint">颜色从原图像素采样，显示缩放不改变采样位置。完全透明像素没有可见颜色；方向键可逐像素移动，Shift+方向键移动 10 像素。</p></section></main>
