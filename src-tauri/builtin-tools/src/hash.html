<main><section class="card"><label>哈希算法<select id="algorithm"><option value="sha256">SHA-256（推荐）</option><option value="md5">MD5</option><option value="sha1">SHA-1</option><option value="sha384">SHA-384</option><option value="sha512">SHA-512</option></select></label><label>预期摘要（可选，用于校验）<input id="expected" placeholder="粘贴预期的十六进制摘要，忽略大小写和空白" spellcheck="false" /></label><div class="actions"><button id="choose" class="primary">选择文件并计算</button><button id="cancel" hidden>取消计算</button></div><progress id="progress" value="0" max="1" hidden></progress><p id="status" class="status" role="status"></p><p class="hint">MD5 和 SHA-1 用于兼容已有校验值，安全敏感场景优先使用 SHA-256。单个文件最高 16 GiB，计算最长 10 分钟。</p></section><section id="results" class="card" hidden><h2>计算结果</h2><dl id="info" class="meta"></dl><label>文件摘要<textarea id="digest" class="digest" readonly spellcheck="false"></textarea></label><button id="copy">复制摘要</button><p id="verification" class="status" role="status"></p></section></main>
