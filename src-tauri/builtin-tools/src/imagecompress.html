<main class="image-tool"><section class="card"><div class="actions"><button id="choose" class="primary">选择图片</button></div><p id="source-info" class="hint">支持 PNG、JPEG、WebP、BMP、TIFF、AVIF、HEIC 等，单张最多 256 MiB、4000 万像素；动画及多页图片处理首帧。</p><div class="grid image-main-settings"><label>输出格式<select id="format"><option value="jpeg">JPEG</option><option value="webp">WebP（保留透明）</option></select></label><label>图片质量（1～100）<input id="quality" type="number" inputmode="numeric" min="1" max="100" value="80"></label></div><div class="actions"><button id="process" class="primary" disabled>压缩图片</button><button id="save" disabled>保存图片</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><p class="hint">保持原图尺寸。JPEG 的透明区域会填充白色。处理后会移除大部分 EXIF 等元数据；体积取决于原图与设置。输出最多 512 MiB，分块保存，预览使用缩略图。</p></section><section id="result" class="card" hidden><h2>压缩结果</h2><p id="result-info" class="image-result-info"></p><div class="image-preview"><img id="preview-image" alt="压缩结果预览"></div></section></main>
