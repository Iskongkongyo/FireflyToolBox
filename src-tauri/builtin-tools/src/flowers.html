<main><section class="card"><label>查询花名、颜色或寓意<input id="search" type="search" maxlength="100" placeholder="例如：玫瑰、黄色、感谢"></label><div id="categories" class="chips catalog-tabs" aria-label="花语分类"></div><label>按供应季节筛选<select id="season"><option value="all">四季不限</option><option value="0">春季：常见 / 季节性供应</option><option value="1">夏季：常见 / 季节性供应</option><option value="2">秋季：常见 / 季节性供应</option><option value="3">冬季：常见 / 季节性供应</option></select></label><p id="count" class="hint"></p><p class="hint">花语是文化中的常见约定，同一种花可有不同寓意。季节按北半球参考；设施栽培、进口、地区与品种会改变供应，请向当地花店确认。</p><p id="status" class="status" role="status"></p></section><div id="flowers" class="flower-grid"></div><section id="empty" class="card" hidden><h2>没有找到匹配的花卉</h2><p class="hint">试试花名、别名或更短的关键词，也可切换分类。</p></section><p class="hint">参考资料：荷兰花卉植物基金会花卉指南及 RHS 栽培资料。供应为选购参考，不是实时库存。</p></main>
