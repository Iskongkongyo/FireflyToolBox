<main><section class="card"><div class="grid"><label>操作<select id="action"><option value="encrypt">加密</option><option value="decrypt">解密</option></select></label><label>密钥编码<select id="key-format"><option value="utf8">UTF-8 文本</option><option value="hex">HEX 字节</option><option value="base64">Base64 字节</option></select></label></div><label>密钥（1～256 字节）<input id="key" type="password" maxlength="1024" autocomplete="off" spellcheck="false"></label><label class="check"><input id="show-key" type="checkbox">显示密钥</label><div class="grid" style="margin-top:16px"><label>输入编码<select id="input-format"><option value="utf8">UTF-8 文本</option><option value="hex">HEX</option><option value="base64">Base64</option></select></label><label>结果编码<select id="output-format"><option value="hex">HEX</option><option value="base64">Base64</option><option value="utf8">UTF-8 文本</option></select></label></div><details><summary>兼容设置</summary><label>先丢弃的密钥流字节（默认 0）<input id="drop" type="number" min="0" max="65536" value="0" inputmode="numeric"></label><p class="hint">标准 RC4 使用 0；RC4-drop 需与对方约定相同的字节数量。</p></details><label>输入内容<textarea id="input" rows="7" maxlength="1048576" spellcheck="false"></textarea></label><div class="actions"><button id="run" class="primary">RC4 加密</button><button id="swap">结果转回输入</button><button id="copy" disabled>复制结果</button><button id="save" disabled>保存 TXT</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><label>结果<textarea id="output" rows="7" readonly spellcheck="false"></textarea></label><p class="hint">RC4 已不适合保护敏感信息，本工具用于旧数据兼容与测试；它不提供完整性校验，错误密钥也可能产生可显示的无意义结果。原始数据上限 256 KiB，内容和密钥不保存，离线计算。</p></section></main>
