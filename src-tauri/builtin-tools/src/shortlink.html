<main><section class="card"><label>操作<select id="action"><option value="create">生成短链接</option><option value="restore">还原短链接</option></select></label><label id="provider-label">生成服务<select id="provider"><option value="spoo.me">spoo.me</option><option value="ulvis.net">ulvis.net</option><option value="suo.yt">suo.yt</option><option value="is.gd">is.gd</option><option value="v.gd">v.gd</option></select></label><label>网页地址<input id="url" type="url" maxlength="4096" spellcheck="false" placeholder="https://example.com/"></label><label id="short-key-label" hidden>自定义短码（可空）<input id="short-key" maxlength="128" spellcheck="false" autocomplete="off" placeholder="留空由 suo.yt 自动生成"><small>最多 128 字符，不含 /、?、# 或控制字符；可用字符与重名情况由服务验证。</small></label><div class="actions"><button id="run" class="primary">生成短链</button><button id="copy" disabled>复制结果</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><label>结果<textarea id="output" rows="3" readonly spellcheck="false"></textarea></label><p id="details" class="hint"></p><details id="hops-box" hidden><summary>查看跳转链</summary><ol id="hops" class="link-hops"></ol></details><p class="hint">生成会把原链接提交给所选服务，不保存链接历史。is.gd / v.gd / ulvis.net 用官方查询还原；spoo.me、suo.yt 及其他 HTTPS 短链只读服务器跳转，最多 5 次、15 秒。HTTP 目标只展示、不继续请求，网页脚本 / 中转页可能无法还原；不会自动打开结果。</p></section></main>
