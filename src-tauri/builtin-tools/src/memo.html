<main><section class="card"><div class="row"><label>查找笔记<input id="search" maxlength="100" placeholder="搜索标题或内容"></label><label>导入编码<select id="encoding"><option value="utf-8">UTF-8 / BOM</option><option value="gbk">GBK</option></select></label><button id="new" class="primary">新建笔记</button><button class="mobile-full-row" id="import">导入文字</button></div><div class="memo-layout"><section class="memo-list-card" aria-label="笔记列表"><div id="notes" class="memo-list"></div></section><div><label>标题<input id="title" maxlength="60" placeholder="未命名笔记"></label><label>内容<textarea id="body" rows="14" maxlength="12000" placeholder="开始记录…"></textarea></label><div class="actions"><button id="copy">复制内容</button><button id="export">导出 TXT</button><button id="delete">删除笔记</button></div><p id="status" class="status" role="status"></p><p id="capacity" class="hint"></p></div></div><div id="delete-confirm" class="inline-confirm" hidden><span>确认删除当前笔记？</span><button id="confirm-delete">删除</button><button id="cancel-delete">取消</button></div><p class="hint">持久存储上限 1 MiB；长笔记可导出为文件。单篇最多 12000 字符，最多 32 篇。</p></section></main>
