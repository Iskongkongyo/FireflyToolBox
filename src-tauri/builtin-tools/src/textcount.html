<main class="textcount-tool"><section class="card"><textarea id="input" rows="10" placeholder="输入或粘贴需要统计的文字"></textarea><div class="actions"><button id="import">导入文本</button><button id="copy">复制统计</button><button id="clear">清空</button></div><p id="status" class="status" role="status"></p><p class="hint">总字符按 Unicode 码点计算；“不含空格”仅去除空格类字符，“不含所有空白”还去除制表和换行。CRLF 为两个换行字符、一次换行；Emoji / 组合字符可由多个码点组成。最多 2 MiB。</p></section><section class="fields"><div class="card"><strong id="total">0</strong><p>总字符（码点）</p></div><div class="card"><strong id="withoutSpaces">0</strong><p>不含空格</p></div><div class="card"><strong id="withoutWhitespace">0</strong><p>不含所有空白</p></div><div class="card"><strong id="visible">0</strong><p>可见字符簇</p></div><div class="card"><strong id="lines">0</strong><p>行数</p></div><div class="card"><strong id="nonemptyLines">0</strong><p>非空行</p></div><div class="card"><strong id="breaks">0</strong><p>换行次数</p></div><div class="card"><strong id="englishWords">0</strong><p>英文字词</p></div><div class="card"><strong id="utf16">0</strong><p>UTF-16 单元</p></div><div class="card"><strong id="utf8">0</strong><p>UTF-8 字节</p></div></section><h2>字符类型</h2><section id="types" class="fields"></section><style>.fields .card{margin:0 0 12px}.fields strong{font-size:22px}</style></main>
