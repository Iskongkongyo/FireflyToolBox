<main id="media-tool" class="image-tool" data-mode="{{mode}}" aria-label="{{title}}"><section class="card"><div class="actions"><button id="choose" class="primary">选择文件</button></div><p id="source-info" class="hint" style="overflow-wrap:anywhere"></p><div class="grid"><label>输出格式<select id="format"></select></label><label id="resolution-field">输出清晰度<select id="resolution"><option value="0">原始尺寸</option><option value="1080">1080p</option><option value="720" selected>720p</option><option value="480">480p</option><option value="360">360p</option><option value="240">240p</option></select></label><label>输出质量<select id="quality"><option value="high">高质量</option><option value="balanced" selected>均衡</option><option value="small">优先缩小体积</option></select></label></div><div id="speed-settings" hidden><div class="grid"><label>倍速（0.25～4）<input id="speed" type="number" min="0.25" max="4" step="0.05" value="2"></label><label class="check"><input id="keep-pitch" type="checkbox" checked>保持原始音调</label><label id="mute-field" class="check"><input id="mute" type="checkbox">去除视频音频</label></div><p class="hint">低于 1 为慢放，高于 1 为快放。取消保持音调时，音高随速度改变，并以 48 kHz 处理音频。</p></div><div id="audio-settings" class="grid" hidden><label>音频码率（kbps）<select id="bitrate"><option value="0">跟随音质档位</option><option value="32">32</option><option value="48">48</option><option value="64">64</option><option value="96">96</option><option value="128">128</option><option value="160">160</option><option value="192">192</option><option value="256">256</option><option value="320">320</option></select></label><label>采样率（Hz）<select id="sample-rate"><option value="0">跟随原始音频（Opus 48 kHz）</option><option value="48000">48000</option><option value="44100">44100</option><option value="32000">32000</option><option value="24000">24000</option><option value="22050">22050</option><option value="16000">16000</option><option value="8000">8000</option></select></label><label>声道<select id="channels"><option value="0">跟随原始音频</option><option value="1">单声道</option><option value="2">双声道</option></select></label></div><div id="gif-settings" class="grid" hidden><label>帧率（1～30 fps）<input id="fps" type="number" min="1" max="30" step="1" value="15"></label><label>起始时间（秒）<input id="start" type="number" min="0" max="86400" step="0.1" value="0"></label><label>片段时长（1～60 秒）<input id="duration" type="number" min="1" max="60" step="0.1" value="5"></label></div><div class="actions"><button id="process" class="primary" disabled>开始处理</button><button id="save" disabled>保存结果</button><button id="cancel" hidden>取消任务</button></div><progress id="progress" max="1" value="0" aria-label="转换进度"></progress><p id="status" class="status" role="status"></p><p id="detail" class="hint"></p><p id="usage-hint" class="hint">清晰度保持原始比例，不放大小视频。质量影响画面、音频码率或 GIF 色彩；转换速度取决于时长、分辨率和设备。文件读写上限为 2 GiB，处理需要足够的临时空间。</p></section><section id="result" class="card" hidden><h2>转换结果</h2><p id="result-info" class="image-result-info"></p><video id="preview" controls playsinline preload="metadata" style="max-width:100%;max-height:360px"></video><audio id="preview-audio" controls preload="metadata" hidden style="width:100%"></audio><img id="preview-image" alt="GIF 转换结果" hidden style="max-width:100%;max-height:360px"></section></main>
