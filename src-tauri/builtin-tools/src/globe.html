<main><section class="card"><div class="globe-toolbar"><button id="spin" aria-pressed="false">自动旋转</button><button id="zoom-in" aria-label="放大地球仪">＋</button><button id="zoom-out" aria-label="缩小地球仪">－</button><button id="reset">重置视角</button></div><div class="globe-options"><label class="check"><input id="graticule" type="checkbox" checked>经纬网</label><label class="check"><input id="names" type="checkbox" checked>国家 / 地区名称</label></div><canvas id="globe" class="globe-canvas" tabindex="0" aria-label="地球仪：拖动旋转，方向键旋转，加减号缩放"></canvas><p id="center" class="globe-coordinates"></p><p id="picked" class="hint">点击地图查看国家或地区；滚轮或双指可缩放。</p><div class="globe-selection"><strong id="region-name">中国</strong><span id="region-english" class="hint"></span></div><label>搜索国家或地区<input id="country-search" type="search" maxlength="80" placeholder="例如：中国、Japan、FR" autocomplete="off"></label><div id="country-results" class="globe-search-results" hidden></div><div id="cities" class="chips"></div><div class="grid"><label>经度（−180～180）<input id="longitude" type="number" min="-180" max="180" step="any" value="116.4" inputmode="decimal"></label><label>纬度（−90～90）<input id="latitude" type="number" min="-90" max="90" step="any" value="39.9" inputmode="decimal"></label></div><div class="actions"><button id="locate" class="primary">定位坐标</button><button id="copy">复制选中坐标</button></div><p id="status" class="status" role="status"></p><p class="hint">国家 / 地区轮廓参考 Natural Earth 1:110m 数据，点击或搜索可查看名称；小岛及沿岸识别可能有误差，仅供浏览。地图和绘图库均随工具内置，无需联网。</p></section></main>
