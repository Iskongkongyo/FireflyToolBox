<main><section class="card"><h2>常用正则</h2><div id="templates" class="chips"></div></section><section class="card"><label>表达式<input id="pattern" placeholder="如：(\w+)@(\w+\.\w+)" spellcheck="false" /></label><div id="flags" class="chips"></div><div class="grid" style="margin-top:16px"><label>测试文本<textarea id="input" rows="7" placeholder="输入需要测试的文本" spellcheck="false"></textarea></label><label>替换内容<textarea id="replacement" rows="7" placeholder="支持 $1、$&amp;、$&lt;name&gt;；可留空查看删除匹配项的效果" spellcheck="false"></textarea></label></div><div class="actions"><button id="run" class="primary">测试匹配</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p></section><section id="results" class="card" hidden><h2>匹配结果<span id="count" class="badge"></span></h2><div id="highlight" class="highlight"></div><p class="hint">位置按 JavaScript 的 UTF-16 索引计算；最多显示 200 条，每个捕获值显示前 256 字符。</p><div class="scroll"><table><thead><tr><th>#</th><th>位置</th><th>匹配内容</th><th>捕获组</th></tr></thead><tbody id="matches"></tbody></table></div><label style="margin-top:18px">替换预览<textarea id="output" rows="6" readonly></textarea></label><button id="copy">复制替换结果</button></section></main>
