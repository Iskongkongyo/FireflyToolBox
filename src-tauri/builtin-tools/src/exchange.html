<main><section class="card"><label>金额<input id="amount" inputmode="decimal" maxlength="25" value="100" placeholder="如：100.50"></label><div class="exchange-direction"><label>原币种<select id="from"></select></label><button id="swap" aria-label="交换币种">⇄</button><label>目标币种<select id="to"></select></label></div><div class="row"><label>结果精度<select id="precision"><option value="2">2 位小数</option><option value="4">4 位小数</option><option value="6">6 位小数</option><option value="8">8 位小数</option></select></label><button id="query" class="primary">获取汇率</button><button class="mobile-full-row" id="copy" disabled>复制结果</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><div id="result" class="exchange-result" hidden><span id="formula"></span><strong id="converted"></strong><p id="rate" class="hint"></p><p id="date" class="hint"></p></div><p id="currencies-note" class="hint"></p><p class="hint">来源：Frankfurter，汇集央行等官方来源的每日参考汇率；不是银行现钞 / 现汇买卖价，也不含手续费。周末、节假日或部分币种会返回较早的来源日期。</p></section></main>
