<main><section class="card"><div class="grid"><label>操作<select id="action"><option value="insert">插入不可见字符</option><option value="remove">清理当前类型</option></select></label><label>不可见字符类型<select id="type"></select></label></div><p id="type-note" class="hint"></p><div id="insert-settings" class="grid"><label>每几个完整字符插入一次<input id="interval" type="number" min="1" max="1000" value="1" inputmode="numeric"></label><label>每次插入数量<input id="repeat" type="number" min="1" max="8" value="1" inputmode="numeric"></label><label class="check"><input id="at-end" type="checkbox">在末尾也插入</label></div><label>原内容<textarea id="input" rows="7" maxlength="65536" placeholder="输入需要处理的内容"></textarea></label><div class="actions"><button id="process" class="primary">生成魔法内容</button><button id="copy" disabled>复制结果</button><button id="save" disabled>保存 TXT</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><label>处理结果<textarea id="output" rows="7" readonly spellcheck="false"></textarea></label><label class="check"><input id="show-markers" type="checkbox">显示插入位置（复制和保存仍使用原结果）</label><pre id="markers" class="magic-markers" hidden></pre><p class="hint">默认按完整字符分隔，不拆开常见 Emoji 组合；旧版设备会按 Unicode 码点处理。文本可能被其他应用规范化或移除不可见字符。输入上限 64 KiB、结果上限 256 KiB，离线处理。</p></section></main>
