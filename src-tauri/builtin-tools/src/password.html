<main class="password-tool">
<div class="password-workspace">
<section class="card password-settings" aria-labelledby="settings-heading">
<h2 id="settings-heading">生成设置</h2>
<div class="password-length-control"><label for="length">密码长度 <span class="hint">6～32 位</span></label><input id="length" type="number" min="6" max="32" value="16" inputmode="numeric" aria-label="密码长度"></div>
<input id="length-slider" class="password-slider" type="range" min="6" max="32" value="16" aria-label="密码长度滑块"><div class="password-range-labels" aria-hidden="true"><span>6 位</span><span>32 位</span></div>
<h3 class="password-section-label">包含的字符</h3>
<div class="password-character-grid">
<label class="check"><input id="digits" type="checkbox" checked><span>数字<small>0–9</small></span></label>
<label class="check"><input id="lower" type="checkbox" checked><span>小写字母<small>a–z</small></span></label>
<label class="check"><input id="upper" type="checkbox" checked><span>大写字母<small>A–Z</small></span></label>
<label class="check"><input id="symbols" type="checkbox" checked><span>常用符号<small>! @ # 等</small></span></label>
</div><p class="hint">每种已选字符至少包含一位。</p>
<label class="check password-exclude"><input id="exclude" type="checkbox">排除易混淆字符 0 O 1 I l</label><button id="generate" class="primary password-generate">生成密码</button>
</section>
<section class="card password-result" aria-labelledby="result-heading">
<div class="password-result-heading"><h2 id="result-heading">当前密码</h2><label class="check"><input id="show" type="checkbox">显示密码</label></div>
<label class="password-field-label" for="password">可输入或编辑密码检测强度</label><input id="password" class="password-output" type="password" maxlength="128" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="点击生成，或在这里输入" aria-describedby="strength-info">
<div class="password-strength"><div class="password-strength-heading"><span>强度参考</span><strong id="strength-label">未输入</strong></div><progress id="strength" max="100" value="0" aria-label="密码强度"></progress><span id="strength-info" class="hint"></span></div>
<div class="actions password-copy-actions"><button id="copy" disabled>复制密码</button></div>
<div class="password-save-row"><label>收藏备注（可选）<input id="label" maxlength="40" placeholder="例如：测试账号" autocomplete="off"></label><button id="favorite" disabled>收藏密码</button></div>
<p id="status" class="status" role="status"></p><p class="hint password-storage-note">使用系统安全随机源。强度为本地规则估计，不检查泄露记录。收藏以明文保存；选择同步网页工具数据时会随之同步。</p>
</section>
</div>
<section class="card password-favorites"><div class="password-result-heading"><h2>收藏的密码 <span id="favorite-count" class="badge">0 / 30</span></h2><span id="favorite-visibility" class="hint">密码已遮挡</span></div><div id="favorites" class="catalog-list"></div><p id="favorite-empty" class="hint">还没有收藏的密码。</p></section>
</main>
