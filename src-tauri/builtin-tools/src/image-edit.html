<main class="image-tool"><section class="card"><button id="choose" class="mobile-full-row primary">选择图片</button><p id="source-info" class="hint" style="overflow-wrap:anywhere">最高 256 MiB、4000 万像素，动画或多页文件处理首帧。</p><div id="editor" hidden><canvas id="canvas" style="display:block;width:100%;max-width:700px;height:auto;touch-action:none;border:1px solid var(--border)"></canvas><div class="grid"><label>比例<select id="ratio"><option value="free">自由裁剪</option><option value="1:1">1:1</option><option value="4:3">4:3</option><option value="16:9">16:9</option><option value="3:4">3:4</option><option value="9:16">9:16</option></select></label><label>旋转<select id="rotation"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label><label>左侧 X<input id="x" type="number" min="0" value="0"></label><label>顶部 Y<input id="y" type="number" min="0" value="0"></label><label>宽度<input id="width" type="number" min="1" value="1"></label><label>高度<input id="height" type="number" min="1" value="1"></label><label class="check"><input id="mirror-x" type="checkbox">水平镜像</label><label class="check"><input id="mirror-y" type="checkbox">垂直镜像</label></div><button id="reset">重置为全图</button></div><div class="grid"><label>输出格式<select id="format"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="webp">WebP</option></select></label><label>JPEG / WebP 质量<input id="quality" type="number" min="1" max="100" value="90"></label></div><div class="actions"><button id="process" class="primary" disabled>处理并预览</button><button id="save" disabled>保存图片</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><p class="hint">坐标按方向校正后的原图像素计算，预览是缩略图；先裁剪，再镜像和旋转。PNG/WebP 保留透明，JPEG 填白；输出最高 512 MiB，去除 EXIF 等元数据。</p></section><section id="result" class="card" hidden><h2>处理结果</h2><p id="result-info"></p><div class="image-preview"><img id="preview-image" alt="裁剪结果预览"></div></section></main>
