<main><div class="graphic-workspace"><section class="card graphic-settings"><h2>图标设置</h2><div class="grid"><label>输出尺寸<select id="size"><option value="256">256 × 256</option><option value="512" selected>512 × 512</option><option value="1024">1024 × 1024</option></select></label><label>内容类型<select id="mode"><option value="symbol">内置图标</option><option value="text">文字</option><option value="image">导入图片</option></select></label></div><label id="symbol-label">选择图标<select id="symbol"></select></label><div id="text-settings" hidden><label>图标文字<input id="text" maxlength="24" value="喵" placeholder="建议 1～4 个字"></label><label>字体<select id="font"><option value="sans">系统黑体</option><option value="serif">衬线字体</option><option value="mono">等宽字体</option></select></label></div><div id="image-settings" hidden><button id="open">导入图标图片</button><p id="image-info" class="hint">PNG / JPEG / WebP / BMP，保留原图颜色。</p></div><label>圆角弧度 <span id="radius-value" class="hint">22%</span><input id="radius" type="range" min="0" max="50" value="22"></label><label>内容大小 <span id="scale-value" class="hint">60%</span><input id="scale" type="range" min="20" max="90" value="60"></label><label id="fg-label">图标 / 文字颜色<span class="qr-color-input"><input id="fg" type="color" value="#ffffff" aria-label="内容颜色"><input id="fg-hex" value="#ffffff" maxlength="7" aria-label="内容 HEX" spellcheck="false"></span></label><div class="grid"><label>背景颜色<span class="qr-color-input"><input id="bg" type="color" value="#276653" aria-label="背景颜色"><input id="bg-hex" value="#276653" maxlength="7" aria-label="背景 HEX" spellcheck="false"></span></label><label>背景方式<select id="background"><option value="solid">纯色</option><option value="gradient">线性渐变</option><option value="transparent">透明</option></select></label></div><label id="bg2-label" hidden>渐变另一端<span class="qr-color-input"><input id="bg2" type="color" value="#83c6a8" aria-label="渐变颜色"><input id="bg2-hex" value="#83c6a8" maxlength="7" aria-label="渐变 HEX" spellcheck="false"></span></label><p id="status" class="status" role="status"></p></section><section class="card icon-preview-card"><h2>实时预览</h2><div class="icon-checker"><canvas id="icon-canvas" width="512" height="512" aria-label="图标预览"></canvas></div><div class="actions"><button id="save-png" class="primary">保存 PNG</button><button id="save-ico">保存 ICO</button><button id="cancel" hidden>取消</button></div><p class="hint">圆角外部保留透明。ICO 包含 256 × 256 PNG 图像；PNG 使用所选尺寸。文字与内置图标离线绘制。</p></section></div></main>
