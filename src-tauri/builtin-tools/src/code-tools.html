<main id="code-tool" class="format-tool" data-language="{{language}}"><section class="card"><div class="format-options"><label>缩进<select id="indent"><option value="2">2 个空格</option><option value="4">4 个空格</option><option value="tab">Tab</option></select></label><label>换行宽度<select id="width"><option value="80">80 字符</option><option value="100">100 字符</option><option value="120">120 字符</option></select></label><label id="module-field" class="check"><input id="module" type="checkbox">JavaScript 模块</label><label id="optimize-field" class="check"><input id="optimize" type="checkbox">压缩时优化表达式与局部变量名</label><label class="check"><input id="keep-comments" type="checkbox" checked>保留注释</label></div><div class="format-panes"><label>输入代码<textarea id="input" spellcheck="false" placeholder="粘贴代码，或导入 UTF-8 文件"></textarea></label><label>处理结果<textarea id="output" readonly spellcheck="false"></textarea></label></div><div class="actions"><button id="import">导入文件</button><button id="format" class="primary">格式化</button><button id="minify">压缩</button><button id="use-result" disabled>结果放回输入</button><button id="copy" disabled>复制结果</button><button id="save" disabled>保存结果</button><button id="clear">清空</button><button id="cancel" hidden>取消</button></div><p id="stats" class="hint"></p><p id="status" class="status" role="status"></p><p id="usage" class="hint">输入最多 1 MiB，输出最多 4 MiB。格式化修改排版；压缩结果请在实际项目中检查。</p></section></main>
