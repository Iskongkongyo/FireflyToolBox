<main class="image-tool hidden-image-tool"><section class="card"><div class="grid"><div class="hidden-source"><h2>亮背景图</h2><button id="front" class="mobile-full-row primary">选择亮背景图</button><p id="front-info" class="hint">尚未选择</p><img id="front-image" alt="亮背景原图" hidden></div><div class="hidden-source"><h2>暗背景图</h2><button id="back" class="mobile-full-row primary">选择暗背景图</button><p id="back-info" class="hint">尚未选择</p><img id="back-image" alt="暗背景原图" hidden></div></div><div class="actions"><button id="swap" disabled>交换两张图</button></div><div class="grid hidden-settings"><label>亮背景亮度比例（50～95%）<input id="white" type="range" min="50" max="95" value="60"><span id="white-value">60%</span></label><label>暗背景亮度比例（5～50%）<input id="black" type="range" min="5" max="50" value="35"><span id="black-value">35%</span></label><label>亮背景色彩强度（0～100%）<input id="white-color" type="range" min="0" max="100" value="0"><span id="white-color-value">0% · 灰度</span></label><label>暗背景色彩强度（0～100%）<input id="black-color" type="range" min="0" max="100" value="0"><span id="black-color-value">0% · 灰度</span></label></div><div class="grid"><label>输出尺寸<select id="output-size"><option value="768">最长边 768 px</option><option value="1024" selected>最长边 1024 px</option><option value="1536">最长边 1536 px</option><option value="1920">最长边 1920 px</option><option value="2560">最长边 2560 px</option><option value="3072">最长边 3072 px</option></select></label><label>两张图尺寸不同时<select id="fit"><option value="contain">等比完整显示（留边）</option><option value="cover">等比铺满（裁切）</option></select></label></div><div class="actions"><button id="process" class="primary" disabled>生成隐藏图</button><button id="save" disabled>保存 PNG</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><p class="hint">单张最多 64 MiB / 2400 万像素。输出按亮背景图比例，自动限制最长边 3072 px、800 万像素，输出文件最多 128 MiB。灰度效果通常更清晰，彩色效果是近似；图片仅在本机处理。</p></section><section id="result" class="card" hidden><h2>黑白背景效果</h2><p id="result-info" class="image-result-info"></p><div class="grid"><div class="hidden-output light"><strong>亮背景</strong><img id="light-preview" alt="在白色背景下的隐藏图"></div><div class="hidden-output dark"><strong>暗背景</strong><img id="dark-preview" alt="在黑色背景下的隐藏图"></div></div><p class="hint">请保存 PNG 原文件。JPEG、截图或某些平台重新压缩会丢失透明度，可能无法切换效果。</p></section></main>
