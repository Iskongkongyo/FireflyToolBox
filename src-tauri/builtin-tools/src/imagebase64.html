<main class="practical-tool"><section class="card"><label>转换方向<select id="mode"><option value="encode">图片 → Base64</option><option value="decode">Base64 → 图片</option></select></label><div id="encode-controls"><div class="actions"><button id="open-image" class="primary">选择图片</button></div><label>输出格式<select id="format"><option value="url">Data URL（含图片格式前缀）</option><option value="raw">纯 Base64</option></select></label></div><div id="decode-controls" hidden><div class="actions"><button id="open-text">打开 Base64 文本</button><button id="decode" class="primary">还原图片</button></div></div><label id="content-label">Base64 内容<textarea id="content" rows="8" maxlength="100663296" readonly spellcheck="false" placeholder="选择图片后将在这里生成 Base64"></textarea></label><p id="content-info" class="hint" aria-live="polite"></p><div class="actions"><button id="copy" disabled>复制 Base64</button><button id="save-text" disabled>保存 Base64</button><button id="save-image" disabled>保存图片</button><button id="clear">清空</button><button id="cancel" hidden>取消</button></div><p id="status" class="status" role="status"></p><div id="preview" class="image-base64-preview" hidden><img id="image" alt="转换图片预览"><p id="image-info" class="hint"></p></div><p class="hint">支持 PNG、JPEG、GIF、WebP、BMP；图片最多 64 MiB，文本最多 96 MiB；大文件分块转换，预览支持 2400 万像素以内的图片，超出时仍可转换和保存。接受纯 Base64 或 Data URL，文件仅在本机处理。</p></section></main>
