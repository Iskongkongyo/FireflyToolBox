<main class="weather-tool"><section class="card"><label>天气来源<select id="provider"><option value="cma">中国气象 · 中央气象台</option><option value="meteo">Open-Meteo · 全球城市</option></select></label><div id="china-controls" class="grid"><label>省份 / 地区<select id="province"></select></label><label>城市 / 区县<select id="china-city"></select></label></div><div id="global-controls" hidden><label>搜索城市<input id="keyword" maxlength="80" placeholder="如：北京、上海、Tokyo"></label><div class="actions"><button id="search">搜索城市</button></div><label>查询结果<select id="global-city"></select></label></div><div class="actions"><button id="refresh" class="primary">查询 / 刷新</button><button id="cancel" hidden>取消</button><button id="copy" disabled>复制天气</button><button id="source" disabled>复制来源链接</button></div><p id="status" class="status" role="status"></p><p class="hint">保存所选城市和最近一次结果，失败时保留同一城市的旧数据。中国气象提供站点观测，Open-Meteo 当前天气为模型估算；未返回的项目显示“—”。</p></section><div id="results" hidden><section class="card"><div class="weather-heading"><div><h2 id="location"></h2><p id="published" class="hint"></p></div><span id="cache-label" class="badge" hidden>缓存数据</span></div><div class="weather-current"><strong id="temperature"></strong><div><h2 id="description"></h2><p id="feel" class="hint"></p></div></div><div id="metrics" class="weather-metrics"></div></section><section id="warning-card" class="card weather-warning" hidden><h2>来源返回的天气预警</h2><p id="warning"></p></section><section class="card"><h2>未来七天</h2><p id="forecast-time" class="hint"></p><div id="days" class="weather-days"></div></section><section id="hourly-card" class="card" hidden><h2 id="hourly-title"></h2><div class="scroll"><table><thead><tr><th>时间</th><th>天气 / 气温</th><th>湿度</th><th>降水 / 概率</th><th>风速</th></tr></thead><tbody id="hours"></tbody></table></div></section><p class="hint">来源：中国气象（中央气象台）或 Open-Meteo。预报可能变化，以来源最新发布为准；来源没有返回预警不代表当地一定没有预警。</p></div></main>
