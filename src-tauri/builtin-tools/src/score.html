<main><section class="card"><div class="row"><label>比赛名称<input id="title" maxlength="100" placeholder="如：周末友谊赛"></label><label>每次加减<input id="step" type="number" min="1" max="1000" value="1"></label></div><div id="teams" class="score-grid"></div><div class="actions"><button id="add">添加队伍</button><button id="undo">撤销上一笔</button><button id="reset">全部归零</button><button id="copy">复制比分</button></div><div id="reset-confirm" class="inline-confirm" hidden><span>将所有队伍的分数归零？</span><button id="confirm-reset">确认归零</button><button id="cancel-reset">取消</button></div><p id="status" class="status" role="status"></p><p class="hint">支持 2–8 支队伍，可编辑队名、加减分、撤销操作。比分自动保存。</p></section></main>
