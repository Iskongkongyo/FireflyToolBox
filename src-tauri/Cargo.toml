[package]
name = "firefly-toolbox"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "firefly_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["tray-icon"] }
toolbox-core = { path = "../crates/toolbox-core" }
toolbox-storage = { path = "../crates/toolbox-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
semver = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros", "net"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
spake2 = "0.4"
chacha20poly1305 = "0.10"
rand = "0.8"
if-addrs = "0.15"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
x509-parser = "0.18"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "=2.5.5"

[target.'cfg(target_os = "windows")'.dependencies]
dirs = "6"
webview2-com = "0.38.2"
windows-core = "0.61"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"

[target.'cfg(any(target_os = "windows", target_os = "android"))'.dependencies]
rquickjs = { version = "0.14", features = ["loader"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
rcgen = "0.14"
