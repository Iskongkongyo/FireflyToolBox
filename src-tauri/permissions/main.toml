# Only the local application page may invoke these Rust commands.
# The browser module iframe has an opaque origin and no remote capability.
[[permission]]
identifier = "main-commands"
description = "Commands used by the main application UI"
commands.allow = [
  "web_file_begin_run",
  "web_file_transport",
  "web_file_open",
  "web_file_read",
  "web_file_create_writer",
  "web_file_preview_writer",
  "web_file_write",
  "web_file_save_writer",
  "web_file_close",
  "web_file_close_run",
  "inspect_module_file",
