<main class="image-tool">
  <div class="heading"><img src="{{asset:assets/badge.svg}}" width="48" height="48" alt="" /><h1>图片亮度处理</h1></div>
  <p>选择图片后调整亮度或转成灰度，确认预览再保存为 PNG。</p>
  <div class="actions">
    <button id="choose" type="button">选择图片</button>
    <button id="save" type="button" disabled>保存 PNG</button>
  </div>
  <section class="controls" aria-label="处理参数">
    <label for="brightness">亮度 <output id="brightness-value">100%</output></label>
    <input id="brightness" type="range" min="20" max="180" value="100" disabled />
    <label class="check"><input id="grayscale" type="checkbox" disabled /> 转成灰度</label>
  </section>
  <canvas id="preview" width="1024" height="576" aria-label="图片预览"></canvas>
  <p id="status" role="status">请选择一张图片。</p>
</main>
