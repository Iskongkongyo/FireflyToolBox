<main class="card-tool">
  <h1>图片卡片生成器</h1>
  <p>输入标题并预览，满意后保存为 PNG。</p>
  <label for="card-title">卡片标题</label>
  <input id="card-title" maxlength="48" value="流萤百宝箱" />
  <canvas id="preview" width="1200" height="630" aria-label="图片预览"></canvas>
  <button id="save-png" type="button">保存 PNG</button>
  <p id="status" role="status"></p>
</main>
